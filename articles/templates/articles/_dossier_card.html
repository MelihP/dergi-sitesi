<article class="dossier-book">
    <a class="dossier-book-link" href="{% url 'articles:dossier_detail' dossier.slug %}">
        <div class="dossier-book-cover">
            {% if dossier.cover %}
                <img class="dossier-book-image" src="{{ dossier.cover.url }}" alt="" loading="lazy">
            {% else %}
                <span class="dossier-book-letter" aria-hidden="true">{{ dossier.title|first }}</span>
            {% endif %}
            <div class="dossier-book-shade" aria-hidden="true"></div>
            <div class="dossier-book-title">
                <span class="eyebrow">DERGİ DOSYASI</span>
                <h3>{{ dossier.title }}</h3>
                <span class="dossier-book-count">{{ dossier.published_article_count }} yazı</span>
            </div>
        </div>
        <span class="dossier-book-open">Dosyayı aç →</span>
    </a>
</article>
