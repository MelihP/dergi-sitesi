<article class="card">
    <a class="card-cover-link" aria-label="{{ article.title }}"
       href="{% url 'articles:detail' article.slug %}">

        {% if article.cover %}
            <img class="card-image"
                 src="{{ article.cover.url }}"
                 alt=""
                 loading="lazy">
        {% else %}
            <div class="cover-placeholder"></div>
        {% endif %}

    </a>
        <div class="card-body">
            {% include "articles/_article_labels.html" %}

            <h3><a class="card-link" href="{% url 'articles:detail' article.slug %}">{{ article.title }}</a></h3>

            <p>{{ article.summary|truncatewords:24 }}</p>

            <span class="meta">{{ article.author_name }}</span>
        </div>
</article>
